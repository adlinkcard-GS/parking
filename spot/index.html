<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Smart Parking - Valet Spot</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
         background: #f5f7fa; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #141e32; }
  .card { width: 100%; max-width: 400px; padding: 14px 16px 24px; text-align: center; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .logo { filter: drop-shadow(0 3px 6px rgba(48,149,219,.35)); }
  .who { font-size: 14px; color: #636363; font-weight: 600; }
  .screen { display: none; }
  .icon { display: block; margin: 0 auto 8px; }
  .display { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); font-size: 40px;
             font-weight: 700; letter-spacing: 4px; padding: 12px; min-height: 74px; margin-bottom: 12px; }
  .display .pre { color: #9aa0a8; letter-spacing: 2px; margin-right: 4px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .key { background: #fff; border: 0; border-radius: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1);
         font-size: 34px; font-weight: 700; color: #141e32; padding: 14px 0; font-family: inherit; }
  .key:active { background: #e8f2fb; }
  .key.del { color: #e11e26; }
  .row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .btn { border: 0; border-radius: 16px; padding: 18px 0; display: flex; align-items: center; justify-content: center; }
  .btn:disabled { opacity: .35; }
  .back { background: #dfe3e8; } .go { background: #009950; }
  .zones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
  .zone { border: 0; border-radius: 18px; min-height: 110px; font-size: 44px; font-weight: 800; font-family: inherit;
          box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .zone:active { transform: scale(.97); }
  .done { border-radius: 24px; padding: 30px 10px; color: #fff; }
  .done .sum { font-size: 34px; font-weight: 800; margin-top: 10px; letter-spacing: 1px; }
  .ok { background: #009950; } .bad { background: #e11e26; }
  .setup p { margin: 6px 0; font-size: 16px; }
  .setup .hint { color: #636363; font-size: 14px; }
  .big { width: 100%; border: 0; border-radius: 14px; color: #fff; background: #009950; font-family: inherit;
         font-size: 20px; padding: 18px 10px; margin-top: 4px; }
  .err { color: #e11e26; min-height: 20px; font-size: 15px; }
  .gear { background: none; border: 0; padding: 6px; }
  .foot { margin-top: 16px; font-size: 12px; color: #9aa0a8; }
  .cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
  .carBtn { border: 3px solid #3095db; background: #fff; border-radius: 18px; min-height: 120px; padding: 10px 6px;
            font-family: inherit; color: #141e32; box-shadow: 0 3px 10px rgba(0,0,0,.12);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .carBtn:active { transform: scale(.97); }
  .carBtn .no { font-size: 46px; font-weight: 800; line-height: 1; }
  .carBtn .mins { font-size: 15px; color: #636363; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .carBtn.mine { border-color: #f39c12; background: #fff4e0; }
  .carBtn.new { animation: pop 1s ease-in-out 3; }
  @keyframes pop { 50% { transform: scale(1.06); background: #e8f2fb; } }
  .empty { padding: 30px 0 20px; opacity: .35; }
  .net { display: none; margin: 0 auto 10px; }
  .kbd { background: #dfe3e8; border: 0; border-radius: 14px; padding: 12px 22px; }
  .flash { border-radius: 24px; padding: 30px 10px; background: #e11e26; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <svg class="logo" viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
      <rect x="4" y="4" width="92" height="92" rx="20" fill="#3095DB"/>
      <text x="50" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#fff">SP</text>
    </svg>
    <span class="who" id="who"></span>
    <button class="gear" id="gear" aria-label="Setup">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#9aa0a8" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <!-- SETUP (done once by the manager) -->
  <div class="screen setup" id="sSetup">
    <p><b id="setTitle">Valet PIN</b></p>
    <p class="hint" id="setHint">Same PIN as the laptop Settings</p>
    <div class="display" id="setDisp"></div>
    <div class="pad" id="setPad"></div>
    <div class="err" id="setErr"></div>
    <button class="big" id="setSave">Next</button>
  </div>

  <!-- HOME: live list of cars waiting for a valet -->
  <div class="screen" id="sHome">
    <svg class="net" id="netOff" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#e11e26" stroke-width="2.5" stroke-linecap="round" aria-label="No connection" role="img"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#e11e26"/><path d="M3 3l18 18"/></svg>
    <div class="cars" id="mineList"></div>
    <div class="cars" id="carList"></div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 64 40" width="140" height="88" aria-hidden="true">
        <path d="M8 26 L14 12 Q16 8 21 8 H43 Q48 8 50 12 L56 26 Q60 27 60 31 V34 H4 V31 Q4 27 8 26 Z" fill="#9aa0a8"/>
        <circle cx="16" cy="34" r="6" fill="#636363"/><circle cx="48" cy="34" r="6" fill="#636363"/>
      </svg>
    </div>
    <button class="kbd" id="toKeypad" aria-label="Type a car number">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#141e32" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"/></svg>
    </button>
  </div>

  <!-- TAKEN by another valet -->
  <div class="screen" id="sTaken">
    <div class="flash">
      <svg viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>

  <!-- 1. CAR NUMBER -->
  <div class="screen" id="sCar">
    <svg class="icon" viewBox="0 0 64 40" width="110" height="68" aria-hidden="true">
      <path d="M8 26 L14 12 Q16 8 21 8 H43 Q48 8 50 12 L56 26 Q60 27 60 31 V34 H4 V31 Q4 27 8 26 Z" fill="#3095DB"/>
      <path d="M17 24 L21 13 H43 L47 24 Z" fill="#cfe6f7"/>
      <circle cx="16" cy="34" r="6" fill="#141e32"/><circle cx="48" cy="34" r="6" fill="#141e32"/>
    </svg>
    <div class="display"><span class="pre">SP</span><span id="carDisp"></span></div>
    <div class="pad" id="carPad"></div>
    <div class="row">
      <button class="btn back" id="carBack" aria-label="Clear">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#141e32" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="btn go" id="carGo" aria-label="Next">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- 2. ZONE -->
  <div class="screen" id="sZone">
    <svg class="icon" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <rect x="4" y="4" width="56" height="56" rx="12" fill="#141e32"/>
      <text x="32" y="47" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#fff">P</text>
    </svg>
    <div class="zones" id="zones"></div>
    <button class="btn back" id="zoneBack" style="width:100%" aria-label="Back">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#141e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <!-- 3. SPOT NUMBER -->
  <div class="screen" id="sSpot">
    <svg class="icon" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <path d="M32 4 C20 4 12 13 12 24 C12 38 32 60 32 60 C32 60 52 38 52 24 C52 13 44 4 32 4 Z" fill="#e11e26"/>
      <circle cx="32" cy="24" r="8" fill="#fff"/>
    </svg>
    <div class="display"><span class="pre" id="spotPre"></span><span id="spotDisp"></span></div>
    <div class="pad" id="spotPad"></div>
    <div class="row">
      <button class="btn back" id="spotBack" aria-label="Back">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#141e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="btn go" id="spotGo" aria-label="Save">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
      </button>
    </div>
  </div>

  <!-- SAVED / ERROR -->
  <div class="screen" id="sDone">
    <div class="done ok" id="doneBox">
      <svg id="icoOk" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
      <svg id="icoBad" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true" style="display:none"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <div class="sum" id="doneSum"></div>
    </div>
    <button class="btn go" id="retry" style="width:100%;margin-top:14px;display:none" aria-label="Try again">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
  </div>

  <p class="foot">ADLINKCARD &middot; Grow Smarter</p>
</div>
<script src="../config.js"></script>
<script>
  // ---- client settings come from ../config.js ----
  var FORM_ID  = SP_CONFIG.ARRIVAL_FORM_ID;
  var ENTRY    = SP_CONFIG.ARRIVAL_ENTRY;
  var SPOTS    = SP_CONFIG.SPOTS || { zones: [], number: true };
  var ZONES    = SPOTS.zones || [];
  var NEED_NO  = SPOTS.number !== false;
  var FEED     = SP_CONFIG.FEED_URL || "";
  var FEED_KEY = SP_CONFIG.FEED_KEY || "";
  var POLL_MS  = 7000;

  var pin = "", vphone = "";
  try { pin = localStorage.getItem("sp_valet_pin") || ""; vphone = localStorage.getItem("sp_valet_phone") || ""; } catch (e) {}

  var params = new URLSearchParams(location.search);
  var startTok = (params.get("t") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");   // from the VIP page

  var car = "", token = "", zone = "", spot = "", claimed = false, lastSend = null;
  var seen = {}, firstPoll = true, current = "";
  function $(id) { return document.getElementById(id); }
  function show(id) {
    current = id;
    ["sSetup", "sHome", "sTaken", "sCar", "sZone", "sSpot", "sDone"].forEach(function (s) { $(s).style.display = (s === id ? "block" : "none"); });
    $("gear").style.visibility = (id === "sHome" || (id === "sCar" && !FEED) ? "visible" : "hidden");
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // little beep for a new car (sound is allowed after the first tap)
  var actx = null;
  document.addEventListener("click", function () {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
  });
  function beep() {
    try {
      if (!actx) return;
      [0, 0.25].forEach(function (d) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = 1100; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.25, actx.currentTime + d);
        o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.15);
      });
    } catch (e) {}
  }

  // keep the screen awake while the page is open
  var wake = null;
  function keepAwake() { try { if ("wakeLock" in navigator && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }); } catch (e) {} }

  // number pads (1-9, 0, backspace)
  function makePad(box, onKey) {
    "1 2 3 4 5 6 7 8 9 . 0 B".split(" ").forEach(function (k) {
      var b = document.createElement("button");
      if (k === ".") { b.style.visibility = "hidden"; }
      b.className = "key" + (k === "B" ? " del" : "");
      b.innerHTML = (k === "B") ? "&#9003;" : k;
      if (k === "B") b.setAttribute("aria-label", "Delete");
      if (k !== ".") b.onclick = function () { buzz(15); onKey(k); };
      box.appendChild(b);
    });
  }

  // ---------- SETUP (manager) ----------
  var setStep = 0, setVal = "";
  function setupShow() {
    $("setTitle").textContent = setStep === 0 ? "Valet PIN" : "Valet WhatsApp number";
    $("setHint").textContent  = setStep === 0 ? "Same PIN as the laptop Settings" : "With country code, no + (e.g. 96170123456). Must be in the laptop Valets list.";
    $("setDisp").textContent  = setStep === 0 ? (setVal.replace(/./g, "\u25CF") || " ") : (setVal || " ");
    $("setSave").textContent  = setStep === 0 ? "Next" : "Save";
  }
  makePad($("setPad"), function (k) {
    if (k === "B") setVal = setVal.slice(0, -1);
    else if (setVal.length < 15) setVal += k;
    $("setErr").textContent = ""; setupShow();
  });
  $("setSave").onclick = function () {
    if (setStep === 0) {
      if (setVal.length < 4) { $("setErr").textContent = "PIN: 4 to 8 digits"; return; }
      pin = setVal.slice(0, 8); setVal = vphone; setStep = 1; setupShow(); return;
    }
    if (setVal.length < 8) { $("setErr").textContent = "Number too short"; return; }
    vphone = setVal;
    try { localStorage.setItem("sp_valet_pin", pin); localStorage.setItem("sp_valet_phone", vphone); } catch (e) {}
    begin();
  };
  $("gear").onclick = function () { setStep = 0; setVal = ""; $("setErr").textContent = ""; setupShow(); show("sSetup"); };

  // ---------- HOME: live feed ----------
  function home() {
    car = ""; token = ""; zone = ""; spot = ""; claimed = false;
    $("who").textContent = vphone ? "\u2022\u2022\u2022 " + vphone.slice(-4) : "";
    if (!FEED) { carShow(); show("sCar"); return; }
    show("sHome"); poll();
  }
  function feedUrl(extra) {
    return FEED + "?k=" + encodeURIComponent(FEED_KEY) + "&p=" + encodeURIComponent(pin) +
           "&v=" + encodeURIComponent(vphone) + (extra || "") + "&_=" + Date.now();
  }
  function shortNo(t) { return String(parseInt(t.replace(/\D/g, ""), 10) || t); }
  function carButton(c, mine) {
    var b = document.createElement("button");
    b.className = "carBtn" + (mine ? " mine" : "") + (!mine && !seen[c.t] && !firstPoll ? " new" : "");
    b.setAttribute("aria-label", "Car " + c.t);
    var n = document.createElement("div"); n.className = "no"; n.textContent = shortNo(c.t);
    var m = document.createElement("div"); m.className = "mins";
    m.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#636363" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    m.appendChild(document.createTextNode(c.m + "'"));
    b.appendChild(n); b.appendChild(m);
    b.onclick = function () { buzz(25); mine ? park(c.t, true) : take(c.t); };
    return b;
  }
  var polling = false;
  function poll() {
    if (!FEED || polling) return;
    polling = true;
    fetch(feedUrl(""), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      polling = false;
      $("netOff").style.display = "none";
      if (!d.ok) { if (d.err === "pin") $("gear").click(); return; }
      var isNew = false;
      d.cars.forEach(function (c) { if (!seen[c.t] && !firstPoll) isNew = true; });
      if (current === "sHome") {
        var ml = $("mineList"), cl = $("carList");
        ml.innerHTML = ""; cl.innerHTML = "";
        d.mine.forEach(function (c) { ml.appendChild(carButton(c, true)); });
        d.cars.forEach(function (c) { cl.appendChild(carButton(c, false)); });
        $("empty").style.display = (d.mine.length || d.cars.length) ? "none" : "block";
      }
      d.cars.forEach(function (c) { seen[c.t] = true; });
      if (isNew) { beep(); buzz([200, 100, 200]); }
      firstPoll = false;
    }).catch(function () { polling = false; $("netOff").style.display = "block"; });
  }
  setInterval(function () { if (current === "sHome" && document.visibilityState === "visible") poll(); }, POLL_MS);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { keepAwake(); if (current === "sHome") poll(); } });
  $("toKeypad").onclick = function () { car = ""; carShow(); show("sCar"); };

  // tap a waiting car: first tap wins
  function take(t) {
    fetch(feedUrl("&a=claim&t=" + encodeURIComponent(t)), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) park(t, true);
      else { buzz([300, 100, 300]); show("sTaken"); setTimeout(home, 1800); }
    }).catch(function () { buzz([300, 100, 300]); $("netOff").style.display = "block"; });
  }
  function release() {
    if (FEED && claimed && token) fetch(feedUrl("&a=release&t=" + encodeURIComponent(token)), { cache: "no-store" }).catch(function () {});
  }

  // ---------- after choosing a car: zone -> spot -> save ----------
  function park(t, isClaim) {
    token = t; claimed = !!isClaim; zone = ""; spot = "";
    if (ZONES.length) show("sZone");
    else if (NEED_NO) startSpot();
    else save();
  }

  // ---------- CAR KEYPAD (when no feed, or a car typed by hand) ----------
  function carShow() { $("carDisp").textContent = car; $("carGo").disabled = car === ""; }
  makePad($("carPad"), function (k) {
    if (k === "B") car = car.slice(0, -1);
    else if (car.length < 5 && !(car === "" && k === "0")) car += k;
    carShow();
  });
  $("carBack").onclick = function () { if (FEED) home(); else { car = ""; carShow(); } };
  $("carGo").onclick = function () {
    if (!car) return;
    park("SP" + (car.length < 4 ? ("0000" + car).slice(-4) : car), false);
  };

  // ---------- ZONE ----------
  function textOn(hex) {
    var c = String(hex).replace("#", ""); if (c.length === 3) c = c.replace(/./g, "$&$&");
    var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#141e32" : "#ffffff";
  }
  ZONES.forEach(function (z) {
    var b = document.createElement("button");
    b.className = "zone"; b.textContent = z.label;
    b.style.background = z.color || "#636363"; b.style.color = textOn(z.color || "#636363");
    b.onclick = function () { buzz(25); zone = String(z.label); if (NEED_NO) startSpot(); else save(); };
    $("zones").appendChild(b);
  });
  if (ZONES.length === 1) $("zones").style.gridTemplateColumns = "1fr";
  // back from the first step: give the car back to the others
  $("zoneBack").onclick = function () { release(); home(); };

  // ---------- SPOT ----------
  function startSpot() { spot = ""; $("spotPre").textContent = zone ? zone + "-" : ""; spotShow(); show("sSpot"); }
  function spotShow() { $("spotDisp").textContent = spot; $("spotGo").disabled = spot === ""; }
  makePad($("spotPad"), function (k) {
    if (k === "B") spot = spot.slice(0, -1);
    else if (spot.length < 4) spot += k;
    spotShow();
  });
  $("spotBack").onclick = function () { if (ZONES.length) show("sZone"); else { release(); home(); } };
  $("spotGo").onclick = function () { if (spot) save(); };

  // ---------- SAVE ----------
  function clean(s) { return String(s).replace(/\|/g, "/").trim(); }
  function save() {
    var where = clean(zone && spot ? zone + "-" + spot : (zone || spot));
    lastSend = { token: token, where: where };
    send();
  }
  function send() {
    var t = lastSend;
    $("doneBox").className = "done ok"; $("icoOk").style.display = "inline"; $("icoBad").style.display = "none";
    $("doneSum").textContent = "..."; $("retry").style.display = "none"; show("sDone");
    var body = new URLSearchParams();
    body.append(ENTRY, "SPOT|" + pin + "|" + t.token + "|" + t.where + "|" + vphone);
    fetch("https://docs.google.com/forms/d/e/" + FORM_ID + "/formResponse", { method: "POST", mode: "no-cors", body: body })
      .then(function () {
        $("doneSum").textContent = t.token + (t.where ? "  \u2192  " + t.where : "");
        buzz([80, 60, 80]);
        setTimeout(home, 2500);
      })
      .catch(function () {
        $("doneBox").className = "done bad"; $("icoOk").style.display = "none"; $("icoBad").style.display = "inline";
        $("doneSum").textContent = t.token; $("retry").style.display = "flex";
        buzz([300, 100, 300]);
      });
  }
  $("retry").onclick = send;

  // ---------- start ----------
  function begin() {
    keepAwake();
    if (startTok) { var t = startTok; startTok = ""; history.replaceState(null, "", location.pathname); $("who").textContent = vphone ? "\u2022\u2022\u2022 " + vphone.slice(-4) : ""; park(t, false); }
    else home();
  }
  if (pin && vphone) begin(); else { setStep = 0; setVal = ""; setupShow(); show("sSetup"); }
</script>
</body>
</html>
